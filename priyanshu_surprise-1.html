<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise ❤️</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e7,#fff);}
.card{background:white;padding:35px 25px;border-radius:25px;text-align:center;
box-shadow:0 8px 30px #bbb;max-width:380px;width:80%}
h1{color:#ff4f81}
button{border:0;background:#ff4f81;color:white;padding:14px 25px;
border-radius:25px;font-size:17px;cursor:pointer}
#surprise{display:none;margin-top:25px;font-size:19px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h1>🌸 Hello Friend 🌸</h1>
<p>Someone made a little surprise for you 😊</p>
<button onclick="document.getElementById('surprise').style.display='block'">
🎁 Click for Surprise
</button>
<div id="surprise">
💖 You are a wonderful friend! 💖<br>
Keep smiling and keep shining ✨<br><br>
— From Priyanshu 😊
</div>
</div>
</body>
</html>
